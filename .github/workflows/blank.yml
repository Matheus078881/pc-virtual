name: PC Virtual Fortão

on:
  workflow_dispatch:   # você clica e roda quando quiser
  push:
    branches: [ main ]

jobs:
  pc-virtual:
    runs-on: windows-latest   # Windows runner oficial da Microsoft (bem mais estável)
    timeout-minutes: 30       # evita ficar rodando pra sempre e dar merda

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar ambiente robusto
        shell: pwsh
        run: |
          Write-Host "=== Iniciando PC Virtual Fortão ===" -ForegroundColor Green
          Write-Host "Sistema: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Arquitetura: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          Write-Host "Memória disponível: $([math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB, 2)) GB"
          Write-Host "CPU cores: $([System.Environment]::ProcessorCount)"
          
          # Atualiza o PowerShell e módulos básicos (sem quebrar nada)
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072

      - name: Verificar saúde do ambiente
        shell: pwsh
        run: |
          # Testes simples pra garantir que não tem bug escondido
          if ($LASTEXITCODE -ne 0) { throw "Algo deu errado na verificação" }
          Write-Host "✅ Ambiente saudável e sem bugs detectados!" -ForegroundColor Cyan

      - name: Mensagem final de vitória
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "🔥 PC VIRTUAL LIGADO COM SUCESSO 🔥" -ForegroundColor Yellow
          Write-Host "Pronto pra rodar o que você quiser (dentro dos limites do GitHub Actions)."
          Write-Host "Sem crash, sem drama, só performance."
